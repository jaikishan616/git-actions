```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎮 Ultimate Mini Game Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;

      background:
        radial-gradient(circle at 20% 20%, #0072ff55, transparent 30%),
        radial-gradient(circle at 80% 80%, #ff00cc44, transparent 30%),
        linear-gradient(135deg, #050816, #111b3a);

      overflow-x: hidden;
    }

    header {
      padding: 60px 20px 30px;
    }

    header h1 {
      font-size: clamp(42px, 8vw, 75px);

      background: linear-gradient(
        90deg,
        #00eaff,
        white,
        #ff2cdf
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow: 0 0 30px #00eaff55;
    }

    header p {
      margin-top: 15px;
      color: #b9c2df;
      font-size: 18px;
    }

    .games {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;

      max-width: 1200px;
      margin: auto;
      padding: 30px 20px 70px;
    }

    .game {
      width: 310px;
      min-height: 330px;

      padding: 30px;

      border: 1px solid #ffffff22;
      border-radius: 22px;

      background: #ffffff0d;

      backdrop-filter: blur(15px);

      box-shadow:
        0 15px 40px #00000066,
        0 0 30px #00eaff11;

      transition: 0.4s;
    }

    .game:hover {
      transform: translateY(-12px);

      border-color: #00eaff88;

      box-shadow:
        0 20px 50px #00000088,
        0 0 30px #00eaff33;
    }

    .game h2 {
      margin-bottom: 25px;
      font-size: 23px;
    }

    button {
      border: none;
      border-radius: 10px;

      padding: 12px 18px;
      margin: 5px;

      color: white;
      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      background: linear-gradient(
        135deg,
        #0072ff,
        #00c6ff
      );

      box-shadow: 0 5px 15px #0072ff55;

      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-3px) scale(1.05);

      box-shadow:
        0 8px 25px #00eaff77;
    }

    button:active {
      transform: scale(0.95);
    }

    input {
      width: 110px;

      padding: 12px;

      border: 1px solid #ffffff22;
      border-radius: 10px;

      background: #00000055;
      color: white;

      outline: none;

      text-align: center;
      font-size: 16px;
    }

    input:focus {
      border-color: #00eaff;

      box-shadow:
        0 0 15px #00eaff66;
    }

    .result {
      min-height: 30px;

      margin-top: 18px;

      color: #00eaff;

      font-weight: bold;

      text-shadow:
        0 0 10px #00eaff88;
    }

    /* Tic Tac Toe */

    #board {
      display: grid;

      grid-template-columns: repeat(3, 65px);

      justify-content: center;

      gap: 7px;

      margin: 20px auto;
    }

    .cell {
      width: 65px;
      height: 65px;

      margin: 0;
      padding: 0;

    }

    .cell:hover {
      background: #00eaff22;

      background: linear-gradient(

        #ff2cdf,
        #8a2be2
      );
    }

      padding: 25px;

      border-top: 1px solid #ffffff11;
    }

    @media (max-width: 700px) {
      header {
        padding-top: 40px;
      }

        width: 90%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 GAME HUB</h1>

    <p>
      Welcome to the Ultimate Mini Game Zone!
    </p>
  </header>


  <main class="games">

    <!-- ROCK PAPER SCISSORS -->

    <section class="game">

      <h2>✊ Rock Paper Scissors</h2>

      <button onclick="rps('Rock')">
        ✊ Rock
      </button>

      <button onclick="rps('Paper')">
        📄 Paper
      </button>

      <button onclick="rps('Scissors')">
        ✂️ Scissors
      </button>

      <p id="rpsResult" class="result">
        Choose your move!
      </p>

    </section>


    <!-- GUESS THE NUMBER -->

    <section class="game">

      <h2>🔢 Guess The Number</h2>

      <p>I'm thinking of a number from 1–10.</p>

      <br>

      <input
        id="guess"
        type="number"
        min="1"
        max="10"
        placeholder="1–10"
      >

      <button onclick="guessNumber()">
        Guess
      </button>

      <p id="guessResult" class="result">
        Good luck!
      </p>

    </section>


    <!-- TIC TAC TOE -->

    <section class="game">

      <h2>❌ Tic-Tac-Toe</h2>

      <div id="board">

        <button class="cell" onclick="play(0)"></button>
        <button class="cell" onclick="play(1)"></button>
        <button class="cell" onclick="play(2)"></button>

        <button class="cell" onclick="play(3)"></button>
        <button class="cell" onclick="play(4)"></button>
        <button class="cell" onclick="play(5)"></button>

        <button class="cell" onclick="play(6)"></button>
        <button class="cell" onclick="play(7)"></button>
        <button class="cell" onclick="play(8)"></button>

      </div>

      <p id="ticResult" class="result">
        Player X's turn
      </p>

      <button class="reset" onclick="resetGame()">
        🔄 Reset Game
      </button>

    </section>

  </main>


  <footer>
    🎮 Mini Game Hub • Made with HTML, CSS & JavaScript
  </footer>


  <script>

    /* ==========================
       ROCK PAPER SCISSORS
       ========================== */

    function rps(player) {

      const choices = [
        "Rock",
        "Paper",
        "Scissors"
      ];

      const computer =
        choices[Math.floor(Math.random() * 3)];

      let result;

      if (player === computer) {

        result = "🤝 Draw!";

      } else if (

        (player === "Rock" &&
          computer === "Scissors") ||

        (player === "Paper" &&
          computer === "Rock") ||

        (player === "Scissors" &&
          computer === "Paper")

      ) {

        result = "🎉 You Win!";

      } else {

        result = "🤖 Computer Wins!";

      }

      document.getElementById("rpsResult").textContent =
        `You chose ${player}. Computer chose ${computer}. ${result}`;
    }


    /* ==========================
       GUESS THE NUMBER
       ========================== */

    let secretNumber =
      Math.floor(Math.random() * 10) + 1;


    function guessNumber() {

      const input =
        document.getElementById("guess");

      const result =
        document.getElementById("guessResult");

      const guess =
        Number(input.value);


      if (guess < 1 || guess > 10) {

        result.textContent =
          "⚠️ Enter a number from 1 to 10.";

        return;
      }


      if (guess === secretNumber) {

        result.textContent =
          "🎉 Correct! You won!";

        secretNumber =
          Math.floor(Math.random() * 10) + 1;

      } else if (guess > secretNumber) {

        result.textContent =
          "⬇️ Too high!";

      } else {

        result.textContent =
          "⬆️ Too low!";

      }
    }


    /* ==========================
       TIC TAC TOE
       ========================== */

    let board = [
      "",
      "",
      "",
      "",
      "",
      "",
      "",
      "",
      ""
    ];

    let currentPlayer = "X";

    let gameOver = false;


    function play(index) {

      if (
        board[index] !== "" ||
        gameOver
      ) {

        return;
      }


      board[index] =
        currentPlayer;


      document
        .getElementsByClassName("cell")[index]
        .textContent =
        currentPlayer;


      if (checkWinner()) {

        document.getElementById("ticResult")
          .textContent =
          `🎉 Player ${currentPlayer} wins!`;

        gameOver = true;

        return;
      }


      if (!board.includes("")) {

        document.getElementById("ticResult")
          .textContent =
          "🤝 It's a draw!";

        gameOver = true;

        return;
      }


      currentPlayer =
        currentPlayer === "X"
          ? "O"
          : "X";


      document.getElementById("ticResult")
        .textContent =
        `Player ${currentPlayer}'s turn`;
    }


    function checkWinner() {

      const wins = [

        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],

        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],

        [0, 4, 8],
        [2, 4, 6]

      ];


      return wins.some(
        combination =>
          combination.every(
            index =>
              board[index] === currentPlayer
          )
      );
    }


    function resetGame() {

      board = [
        "",
        "",
        "",
        "",
        "",
        "",
        "",
        "",
        ""
      ];


      currentPlayer = "X";

      gameOver = false;


      document
        .querySelectorAll(".cell")
        .forEach(cell => {
          cell.textContent = "";
        });


      document.getElementById("ticResult")
        .textContent =
        "Player X's turn";
    }

  </script>

</body>
</html>
```
